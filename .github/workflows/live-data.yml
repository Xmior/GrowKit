name: Refresh live data
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/fetch-live.py
      - run: |
          git config user.name "growkit-bot"
          git config user.email "growkit-bot@users.noreply.github.com"
          git add data/live
          git commit -m "Refresh live data" || exit 0
          git push
